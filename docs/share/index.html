<!doctype html>
<!--
  Landing page for GiftLoop share links.
  Served by GitHub Pages at https://kavourei.github.io/giftloop/share/
  (repo Settings → Pages → Deploy from branch: main, folder: /docs).

  A share link looks like  https://kavourei.github.io/giftloop/share/#d=<card>
  The card data sits after "#", so it never reaches any server.
  This page hands the card to the app via giftloop://share?d=<card>. If the app
  is not installed, the visitor is sent to the App Store instead.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GiftLoop</title>
  <meta property="og:title" content="Gift ideas shared with you on GiftLoop">
  <meta property="og:description" content="Tap to open them in GiftLoop.">
  <style>
    :root { --coral:#FF6B6B; --cream:#FFFBF0; --ink:#2D2D2D; --muted:#6b6b6b; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           background:var(--cream); color:var(--ink); padding:24px 16px;
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { max-width:380px; width:100%; text-align:center; }
    .gift { font-size:64px; }
    h1 { font-size:24px; margin:12px 0 8px; }
    p { color:var(--muted); line-height:1.5; margin:0 0 24px; }
    a.btn { display:block; padding:15px 20px; border-radius:16px; font-weight:700;
            text-decoration:none; margin-bottom:12px; }
    .primary { background:var(--coral); color:#fff; }
    .secondary { background:#fff; color:var(--ink); border:1px solid #eee; }
  </style>
</head>
<body>
<main>
  <div class="gift">🎁</div>
  <h1 id="title">Someone shared gift ideas with you</h1>
  <p id="text">Open them in GiftLoop. If you don't have the app yet, get it free from the App Store first, then tap this link again.</p>
  <a class="btn primary" id="open" href="#">Open in GiftLoop</a>
  <a class="btn secondary" id="store" href="#">Get GiftLoop</a>
</main>
<script>
  // TODO: replace with the real App Store link once the app is live,
  // e.g. "https://apps.apple.com/app/id1234567890".
  var APP_STORE_URL = "https://apps.apple.com/search?term=GiftLoop";
  var PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=com.kavour.giftloop";

  var isGreek = (navigator.language || "").toLowerCase().indexOf("el") === 0;
  if (isGreek) {
    document.documentElement.lang = "el";
    document.getElementById("title").textContent = "Κάποιος μοιράστηκε ιδέες δώρων μαζί σου";
    document.getElementById("text").textContent = "Άνοιξέ τες στο GiftLoop. Αν δεν έχεις ακόμα την εφαρμογή, κατέβασέ τη δωρεάν από το App Store και πάτησε ξανά τον σύνδεσμο.";
    document.getElementById("open").textContent = "Άνοιγμα στο GiftLoop";
    document.getElementById("store").textContent = "Λήψη GiftLoop";
  }

  var isAndroid = /android/i.test(navigator.userAgent);
  var storeUrl = isAndroid ? PLAY_STORE_URL : APP_STORE_URL;
  var match = /[#&]d=([A-Za-z0-9_\-]+)/.exec(location.hash);
  var appUrl = match ? "giftloop://share?d=" + match[1] : "giftloop://";

  document.getElementById("open").href = appUrl;
  document.getElementById("store").href = storeUrl;

  // Try the app straight away. If it opens, this page goes to the background
  // and the timer is cancelled; if not, go to the store.
  var timer = setTimeout(function () { location.href = storeUrl; }, 1800);
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) clearTimeout(timer);
  });
  window.addEventListener("pagehide", function () { clearTimeout(timer); });
  location.href = appUrl;
</script>
</body>
</html>
